<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5e50a1" />
      <stop offset="50%" stop-color="#4c3d94" />
      <stop offset="100%" stop-color="#1e1840" />
    </linearGradient>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="124" height="124" rx="28" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" />

  <!-- Stylized H Mark -->
  <g filter="url(#shadow)">
    <!-- Left vertical bar -->
    <rect x="30" y="28" width="18" height="72" rx="9" fill="url(#hGrad)" />
    <!-- Right vertical bar -->
    <rect x="80" y="28" width="18" height="72" rx="9" fill="url(#hGrad)" />
    <!-- Horizontal connector -->
    <rect x="36" y="55" width="56" height="18" rx="9" fill="url(#hGrad)" />
    <!-- Accent center node (vitality cross/spark) -->
    <circle cx="64" cy="64" r="8" fill="url(#accentGrad)" />
  </g>
</svg>
